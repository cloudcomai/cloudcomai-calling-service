# Replace the placeholder with TURN_SECRET from .env before deployment.
listening-port=3478
# Uncomment only after a TLS certificate is configured and TURN_TLS_ENABLED=true.
# tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=REPLACE_WITH_TURN_SECRET
realm=calls.example.com
server-name=calls.example.com
listening-ip=0.0.0.0
# Set external-ip=PUBLIC_IP/PRIVATE_IP if running behind NAT.
min-port=50000
max-port=50100
no-multicast-peers
no-cli
no-loopback-peers
# cert=/etc/letsencrypt/live/calls.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/calls.example.com/privkey.pem
# no-tlsv1
# no-tlsv1_1
