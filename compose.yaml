services:
 mysql:
  image: mysql:8.4
  restart: unless-stopped
  environment:
   MYSQL_DATABASE: ${MYSQL_DATABASE:-cloudcomai_calls}
   MYSQL_USER: ${MYSQL_USER:-calling_service}
   MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
   MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
  volumes:
   - mysql_data:/var/lib/mysql
   - ./src/db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
  healthcheck:
   test: ["CMD-SHELL","mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
   interval: 10s
   timeout: 5s
   retries: 10
  networks: [private]
 calling-service:
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
   MYSQL_HOST: mysql
  depends_on:
   mysql: {condition: service_healthy}
  ports:
   - "127.0.0.1:8081:8081"
   - "${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-49999}:${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-49999}/udp"
   - "${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-49999}:${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-49999}/tcp"
  networks: [private]
  init: true
  stop_grace_period: 30s
 coturn:
  image: coturn/coturn:4.6
  restart: unless-stopped
  command: ["-c","/etc/coturn/turnserver.conf","--no-cli"]
  volumes:
   - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
  ports:
   - "3478:3478/udp"
   - "3478:3478/tcp"
   - "50000-50100:50000-50100/udp"
  networks: [private]
networks:
 private:
  driver: bridge
volumes:
 mysql_data:
